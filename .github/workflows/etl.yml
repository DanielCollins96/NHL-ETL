# .github/workflows/etl.yml
name: NHL Daily ETL

on:
  schedule:
    - cron: '0 6,22 * * *'  # 11 PM and 3 PM MST (06:00, 22:00 UTC)
  workflow_dispatch:  # Manual trigger from GitHub UI
    inputs:
      team_scope:
        description: Scrape playing-window teams, or every team
        type: choice
        options:
          - playing
          - all
        default: playing
      nextjs_hockey_ref:
        description: nextjs-hockey branch to run the fantasy build from
        type: string
        default: main

permissions:
  id-token: write  # Required for OIDC authentication with AWS
  contents: read

jobs:
  run-etl:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout ETL repo
        uses: actions/checkout@v4
      
      - name: Get Runner IP
        id: ip
        run: echo "ipv4=$(curl -s https://api.ipify.org)" >> $GITHUB_OUTPUT
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-2
      
      - name: Add IP to RDS Security Group
        run: |
          RUNNER_IP="${{ steps.ip.outputs.ipv4 }}"
          SECURITY_GROUP_ID="${{ secrets.RDS_SECURITY_GROUP_ID }}"
          
          echo "Adding IP ${RUNNER_IP}/32 to security group ${SECURITY_GROUP_ID}"
          
          aws ec2 authorize-security-group-ingress \
            --group-id $SECURITY_GROUP_ID \
            --protocol tcp \
            --port 5432 \
            --cidr ${RUNNER_IP}/32 \
            --tag-specifications "ResourceType=security-group-rule,Tags=[{Key=ManagedBy,Value=GitHubActions},{Key=CreatedAt,Value=$(date -u +%Y-%m-%dT%H:%M:%SZ)}]" 2>&1 || echo "Rule may already exist"
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'
      
      - name: Install scraper from GitHub
        run: pip install git+https://github.com/DanielCollins96/NHLScraper.git
      
      - name: Install ETL dependencies
        run: pip install -r requirements.txt
      
      - name: Run ETL
        run: python run_etl.py
        env:
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
          DB_CONNECTION_2: ${{ secrets.DB_CONNECTION_2 }}
          ETL_PIPELINES: rosters,players,season_stats,games
          ETL_TEAM_SCOPE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.team_scope || 'playing' }}
          SCHEDULE_LOOKBACK_DAYS: '2'
          SCHEDULE_LOOKAHEAD_DAYS: '0'

      - name: Publish read models to S3
        if: success() || failure()
        run: python publish_read_models_to_s3.py
        env:
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
          READ_MODEL_S3_BUCKET: ${{ secrets.READ_MODEL_S3_BUCKET || vars.READ_MODEL_S3_BUCKET }}
          READ_MODEL_S3_PREFIX: ${{ secrets.READ_MODEL_S3_PREFIX || vars.READ_MODEL_S3_PREFIX }}
          READ_MODEL_EXPORT_GROUPS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.team_scope == 'all' && 'games,players,teams,seasons,indexes' || 'playing' }}
          SCHEDULE_LOOKBACK_DAYS: '2'
          SCHEDULE_LOOKAHEAD_DAYS: '0'
          READ_MODEL_UPLOAD_WORKERS: ${{ vars.READ_MODEL_UPLOAD_WORKERS || '16' }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID || vars.CLOUDFRONT_DISTRIBUTION_ID }}
          CLOUDFRONT_INVALIDATION_MODE: ${{ vars.CLOUDFRONT_INVALIDATION_MODE || 'none' }}

      - name: Check out nextjs-hockey for the fantasy build
        uses: actions/checkout@v4
        with:
          repository: DanielCollins96/nextjs-hockey
          path: nextjs-hockey
          ref: ${{ github.event.inputs.nextjs_hockey_ref || 'main' }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'nextjs-hockey/package-lock.json'

      # Hits and blocked shots come from the NHL API, not Postgres, so the
      # fantasy pools are built by the app's Node script rather than the publisher.
      - name: Publish fantasy read models to S3
        working-directory: nextjs-hockey
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          # Node ships neither the RDS CA nor Supabase's, so sslmode=require can't verify
          # either server without them. Trust both, so this works whichever one
          # DB_CONNECTION points at.
          curl -fsSL -o "$RUNNER_TEMP/rds-global-bundle.pem" https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem
          cat "$RUNNER_TEMP/rds-global-bundle.pem" "$GITHUB_WORKSPACE/certs/prod-ca-2021.crt" > "$RUNNER_TEMP/db-ca-bundle.pem"
          export NODE_EXTRA_CA_CERTS="$RUNNER_TEMP/db-ca-bundle.pem"
          # node-postgres does not understand SQLAlchemy's +psycopg2 driver suffix.
          DATABASE_URL="${DB_CONNECTION/+psycopg2/}"
          echo "::add-mask::$DATABASE_URL"
          export DATABASE_URL
          node scripts/build-fantasy-read-models.mjs
        env:
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
          READ_MODEL_S3_BUCKET: ${{ secrets.READ_MODEL_S3_BUCKET || vars.READ_MODEL_S3_BUCKET }}
          READ_MODEL_S3_PREFIX: ${{ secrets.READ_MODEL_S3_PREFIX || vars.READ_MODEL_S3_PREFIX }}
      
      - name: Remove IP from RDS Security Group
        if: always()  # Runs even if previous steps fail
        run: |
          RUNNER_IP="${{ steps.ip.outputs.ipv4 }}"
          SECURITY_GROUP_ID="${{ secrets.RDS_SECURITY_GROUP_ID }}"
          
          echo "Removing IP ${RUNNER_IP}/32 from security group ${SECURITY_GROUP_ID}"
          
          aws ec2 revoke-security-group-ingress \
            --group-id $SECURITY_GROUP_ID \
            --protocol tcp \
            --port 5432 \
            --cidr ${RUNNER_IP}/32 2>&1 || echo "Rule may not exist or already removed"
